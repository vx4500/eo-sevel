<ul class="acc-liste">{% for i in interventions[:(max_interventions or 8)] %}<li><a href="/bande/{{ i.bande_id }}" class="acc-date {{ i.urgence }}"><span class="jour"><b>{{ i.date[8:10] }}</b><small>{{ i.date[5:7] }}/{{ i.date[2:4] }}</small></span><span class="quoi"><b>{{ i.nom }}</b><small>Bande {{ i.code }}</small></span><span class="dans">{{ i.delai or '' }}</span></a></li>{% else %}<li class="acc-vide">Aucune intervention planifiée.</li>{% endfor %}</ul>
