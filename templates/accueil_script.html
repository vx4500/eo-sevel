<script>
(function () {
  var COULEURS = { t: '#0369a1', h: '#15803d', ventil: '#b45309' };
  var svgs = document.querySelectorAll('.band-climat-courbe');
  var parSalle = {};
  svgs.forEach(function (svg) { var s = svg.getAttribute('data-salle'); if (s) { (parSalle[s] = parSalle[s] || []).push(svg); } });
  Object.keys(parSalle).forEach(function (salle) {
    fetch('/ambiance/salle/' + encodeURIComponent(salle) + '/historique.json?heures=48', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (data) {
        var series = data.series || {};
        parSalle[salle].forEach(function (svg) {
          var g = svg.getAttribute('data-grandeur'), pts = series[g] || [];
          if (pts.length < 2) { svg.remove(); return; }
          var v = pts.map(function (p) { return p[1]; }), mi = Math.min.apply(null, v), ma = Math.max.apply(null, v);
          if (mi === ma) { mi -= 1; ma += 1; }
          var t0 = pts[0][0], t1 = pts[pts.length - 1][0];
          function x(ts) { return 2 + (t1 === t0 ? 0 : (ts - t0) / (t1 - t0) * 116); }
          function y(val) { return 26 - (val - mi) / (ma - mi) * 24; }
          var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', pts.map(function (q, i) { return (i ? 'L' : 'M') + x(q[0]).toFixed(1) + ',' + y(q[1]).toFixed(1); }).join(' '));
          p.setAttribute('fill', 'none'); p.setAttribute('stroke', COULEURS[g] || '#0369a1'); p.setAttribute('stroke-width', '1.4');
          svg.appendChild(p);
        });
      })
      .catch(function () { parSalle[salle].forEach(function (svg) { svg.remove(); }); });
  });
})();
function accSaisie(type) {
  var fab = document.getElementById('fab'); if (!fab) { return; }
  if (fab.getAttribute('aria-expanded') !== 'true') { fab.click(); }
  var b = document.querySelector('.fab-t[data-type="' + type + '"]'); if (b) { b.click(); }
}
</script>
